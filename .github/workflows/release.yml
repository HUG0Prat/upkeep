name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }

      - name: Unit tests
        run: npx vitest run

      - name: Build every package
        run: node scripts/build-all.mjs

      - name: Smoke test
        run: node scripts/smoke-packaged.mjs

      - name: Release notes
        run: node scripts/release-notes.mjs ${{ github.ref_name }} release-notes.md

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: UpKeep ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.appx
            dist/*.zip
            dist/*.7z
            dist/SHA256SUMS.txt
            dist/latest.yml
            dist/*.blockmap
